version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "typescript"
    # @types/vscode must not exceed engines.vscode (^1.110.0) — vsce refuses
    # to package when the typings declare a newer API than the engine floor.
    # Pin it to the minimum supported VS Code version; bump manually together
    # with engines.vscode when raising the floor.
    ignore:
      - dependency-name: "@types/vscode"
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    # pnpm/action-setup@v6 self-installer pulls pnpm 11 even when a v10.x
    # 'version' input is set, which breaks the v9 lockfile parser. Stay on v5
    # until upstream is fixed.
    ignore:
      - dependency-name: "pnpm/action-setup"
        versions: [">=6"]
    groups:
      actions-deps:
        patterns:
          - "*"
