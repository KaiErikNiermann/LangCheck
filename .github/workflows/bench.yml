name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - "rust-core/**"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Run benchmarks (current)
        run: cargo bench --bench benchmarks 2>&1 | tee bench-current.txt

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Run benchmarks (base)
        working-directory: base/rust-core
        run: cargo bench --bench benchmarks 2>&1 | tee bench-base.txt

      - name: Compare and comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const current = fs.readFileSync('rust-core/bench-current.txt', 'utf8');
            const base = fs.readFileSync('base/rust-core/bench-base.txt', 'utf8');

            const toNs = (value, unit) => parseFloat(value) * ({ ns: 1, 'µs': 1e3, ms: 1e6, s: 1e9 }[unit] ?? NaN);

            // Each divan row is "├─ name  fastest │ slowest │ median │ mean │
            // samples │ iters". The median, not the fastest: a single best
            // sample is the noisiest number in the row.
            function parseBench(text) {
              const results = {};
              for (const line of text.split('\n')) {
                const name = line.match(/[├╰]─\s+(\S+)\s/);
                if (!name) continue;
                const times = [...line.matchAll(/([\d.]+)\s*(ns|µs|ms|s)\b/g)];
                const median = times[2];
                if (median) results[name[1]] = toNs(median[1], median[2]);
              }
              return results;
            }

            // A regression has to be both relatively and absolutely large.
            // Base and current run back to back on one shared runner, and a
            // sub-microsecond bench (rule_normalize_known is ~50 ns) moves
            // 25-50% between runs on noise alone, which failed Dependabot PRs
            // that changed nothing it measures. The table still shows every
            // change; only the gate needs the floor.
            const THRESHOLD_PCT = 20;
            const MIN_DELTA_NS = 500;
            const regressed = (baseNs, currentNs) =>
              (currentNs - baseNs) / baseNs * 100 > THRESHOLD_PCT && currentNs - baseNs > MIN_DELTA_NS;

            const currentResults = parseBench(current);
            const baseResults = parseBench(base);

            let body = '## Benchmark Results\n\n';
            body += '| Benchmark | Base | Current | Change |\n';
            body += '|-----------|------|---------|--------|\n';

            let hasRegression = false;
            for (const [name, currentNs] of Object.entries(currentResults)) {
              const baseNs = baseResults[name];
              if (baseNs) {
                const change = (currentNs - baseNs) / baseNs * 100;
                const worse = regressed(baseNs, currentNs);
                const emoji = worse ? '🔴' : change > THRESHOLD_PCT ? '🟡' : change < -THRESHOLD_PCT ? '🟢' : '⚪';
                if (worse) hasRegression = true;
                const fmt = (ns) => ns > 1e6 ? `${(ns/1e6).toFixed(2)}ms` : ns > 1000 ? `${(ns/1000).toFixed(2)}µs` : `${ns.toFixed(0)}ns`;
                body += `| ${name} | ${fmt(baseNs)} | ${fmt(currentNs)} | ${emoji} ${change.toFixed(1)}% |\n`;
              } else {
                const fmt = (ns) => ns > 1e6 ? `${(ns/1e6).toFixed(2)}ms` : ns > 1000 ? `${(ns/1000).toFixed(2)}µs` : `${ns.toFixed(0)}ns`;
                body += `| ${name} | *new* | ${fmt(currentNs)} | ➕ |\n`;
              }
            }

            if (hasRegression) {
              body += `\n⚠️ **Performance regression detected (median >${THRESHOLD_PCT}% and >${MIN_DELTA_NS}ns slower)**\n`;
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (error) {
              // Dependabot PRs get a forced read-only GITHUB_TOKEN regardless
              // of the `permissions:` block above, so posting a comment 403s.
              // Regression detection below still runs either way.
              core.warning(`Could not post benchmark comment: ${error.message}`);
            }

            if (hasRegression) {
              core.setFailed(`Benchmark regression detected (median >${THRESHOLD_PCT}% and >${MIN_DELTA_NS}ns slower)`);
            }
