name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - "rust-core/**"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Run benchmarks (current)
        run: cargo bench --bench benchmarks 2>&1 | tee bench-current.txt

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Run benchmarks (base)
        working-directory: base/rust-core
        run: cargo bench --bench benchmarks 2>&1 | tee bench-base.txt

      - name: Compare and comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const current = fs.readFileSync('rust-core/bench-current.txt', 'utf8');
            const base = fs.readFileSync('base/rust-core/bench-base.txt', 'utf8');

            function parseBench(text) {
              const results = {};
              for (const line of text.split('\n')) {
                // Match divan output: "├─ name  fastest │ ..."
                const match = line.match(/[├╰]─\s+(\S+)\s+([\d.]+)\s*(ns|µs|ms|s)/);
                if (match) {
                  const [, name, value, unit] = match;
                  let ns = parseFloat(value);
                  if (unit === 'µs') ns *= 1000;
                  if (unit === 'ms') ns *= 1e6;
                  if (unit === 's') ns *= 1e9;
                  results[name] = ns;
                }
              }
              return results;
            }

            // Runner-to-runner noise routinely moves these benchmarks by ~5-10%,
            // so only treat a change beyond this as a real regression/improvement.
            const THRESHOLD_PCT = 15;

            const currentResults = parseBench(current);
            const baseResults = parseBench(base);

            let body = '## Benchmark Results\n\n';
            body += '| Benchmark | Base | Current | Change |\n';
            body += '|-----------|------|---------|--------|\n';

            let hasRegression = false;
            for (const [name, currentNs] of Object.entries(currentResults)) {
              const baseNs = baseResults[name];
              if (baseNs) {
                const change = (currentNs - baseNs) / baseNs * 100;
                const emoji = change > THRESHOLD_PCT ? '🔴' : change < -THRESHOLD_PCT ? '🟢' : '⚪';
                if (change > THRESHOLD_PCT) hasRegression = true;
                const fmt = (ns) => ns > 1e6 ? `${(ns/1e6).toFixed(2)}ms` : ns > 1000 ? `${(ns/1000).toFixed(2)}µs` : `${ns.toFixed(0)}ns`;
                body += `| ${name} | ${fmt(baseNs)} | ${fmt(currentNs)} | ${emoji} ${change.toFixed(1)}% |\n`;
              } else {
                const fmt = (ns) => ns > 1e6 ? `${(ns/1e6).toFixed(2)}ms` : ns > 1000 ? `${(ns/1000).toFixed(2)}µs` : `${ns.toFixed(0)}ns`;
                body += `| ${name} | *new* | ${fmt(currentNs)} | ➕ |\n`;
              }
            }

            if (hasRegression) {
              body += `\n⚠️ **Performance regression detected (>${THRESHOLD_PCT}% slower)**\n`;
            }

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            } catch (error) {
              // Dependabot PRs get a forced read-only GITHUB_TOKEN regardless
              // of the `permissions:` block above, so posting a comment 403s.
              // Regression detection below still runs either way.
              core.warning(`Could not post benchmark comment: ${error.message}`);
            }

            if (hasRegression) {
              core.setFailed(`Benchmark regression >${THRESHOLD_PCT}% detected`);
            }
