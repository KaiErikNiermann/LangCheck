name: Lint Prose

on:
  push:
    branches: [main]
    paths: &prose-paths
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".languagecheck.yaml"
      - ".languagecheck-words.txt"
      - ".vale.ini"
      - ".github/workflows/lint-prose.yml"
  pull_request:
    branches: [main]
    paths: *prose-paths
  workflow_dispatch:

concurrency:
  group: lint-prose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: Check the docs
    runs-on: ubuntu-latest

    # The same image and port docker-compose.yml uses, so a finding here is a
    # finding a contributor can reproduce with `docker compose up`.
    services:
      languagetool:
        image: erikvl87/languagetool
        ports:
          - 8010:8010
        options: >-
          --health-cmd "wget -qO- http://localhost:8010/v2/languages || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 40s

    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core

      - name: Install Vale
        # Pinned: `ai-tells` is a rule package, and a Vale that changed how it
        # reads one would change what this job reports without a commit.
        env:
          VALE_VERSION: "3.13.1"
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale --version

      - name: Fetch the Vale package
        # `ai-tells` is synced rather than vendored: 137 rule files would
        # otherwise sit in the diff of every unrelated change.
        run: vale sync

      - name: Build the checker
        working-directory: rust-core
        run: cargo build --release --bin language-check

      - name: Wait for LanguageTool
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8010/v2/languages > /dev/null; then
              echo "LanguageTool is up after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "LanguageTool did not answer on :8010" >&2
          exit 1

      - name: Show what the config selects
        # Printed before the check so a run that reports nothing can be told
        # from one that checked nothing.
        run: ./rust-core/target/release/language-check config files

      - name: Check the prose
        # Warnings and worse only. The style rules run and are reported in the
        # editor, but a docs change stopped by "consider a different verb" is
        # a change that goes in with the check switched off -- so the gate is
        # for findings that say the text is wrong.
        run: ./rust-core/target/release/language-check check . --fail-on warning
