name: Lint Rust

on:
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - "proto/**"
      - ".github/workflows/lint-rust.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust-core/**"
      - "proto/**"
      - ".github/workflows/lint-rust.yml"

concurrency:
  group: lint-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust Lint & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust-core

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Advisories, licenses & dependency check
        run: cargo install cargo-deny --version 0.22.0 --locked && cargo deny check
