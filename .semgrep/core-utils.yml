# Reuse the helpers this repo already has, instead of growing another private copy.
#
# Every rule here was written against duplication that EXISTS in the tree, and the count is
# recorded in the rule's message. That matters: a pattern rule matching nothing is
# indistinguishable from a clean codebase, so each rule has a documented answer it must find.
# The one forward-only guard (`use-shared-prose-skip-helpers`) says so in its message rather
# than pretending to a backlog it does not have.
#
# Scope note: clippy and eslint both run on this tree already. Nothing here duplicates them —
# these are repo-specific reuse facts no general linter can know.
rules:
  - id: use-safe-slice
    languages: [rust]
    severity: WARNING
    message: >-
      `text_util::safe_slice` already encapsulates "snap both ends to char boundaries, clamp to
      len, slice". Six sites snap by hand instead — four in `hashing.rs`, two in `names.rs` —
      and `names.rs` snaps only ONE end (`preceding_window` floors `lo` but slices to a
      raw `start`), which is the exact panic `safe_slice` exists to prevent. If you genuinely need
      a one-sided slice (`&text[..sb]`), add the helper to `text_util` rather than snapping
      inline; the point is that this reasoning lives in one module.
    paths:
      exclude:
        - "**/rust-core/src/text_util.rs"
    pattern-either:
      - pattern: $TEXT.floor_char_boundary(...)
      - pattern: $TEXT.ceil_char_boundary(...)

  - id: use-logger-not-console
    languages: [typescript]
    severity: WARNING
    message: >-
      Use the `Logger` from `logger.ts` (the `log` instance), not `console.*`. `extension.ts`
      routes 100+ messages through it into the extension's output channel, which is what a user
      can actually open and paste into a bug report; `console.*` goes to the Extension Host
      devtools console that nobody has open. `client.ts` has 4 such calls, and they are on the
      core-crashed and core-restarting paths — precisely the ones you need evidence for.
    paths:
      exclude:
        - "**/extension/src/logger.ts"
        - "**/extension/src/test/"
    pattern-either:
      - pattern: console.log(...)
      - pattern: console.error(...)
      - pattern: console.warn(...)
      - pattern: console.debug(...)
      - pattern: console.info(...)

  - id: use-shared-prose-skip-helpers
    languages: [rust]
    severity: INFO
    message: >-
      `prose::shared` owns delimiter scanning — `skip_balanced_bytes` (escape-aware) and
      `skip_command_args_bytes`, plus `run_end` and `close_at` for the simpler runs.
      Hand-rolled depth counting drifts from them on escapes and on nesting.
      FORWARD GUARD, not a backlog: the tree currently has zero hand-rolled copies, which is why
      this is INFO. It exists because adoption is uneven — forester.rs uses `shared::` 13 times
      and latex.rs and tinylang.rs 7 each, while typst.rs uses it zero times and org.rs and
      rst.rs once, so the next extractor is where a private copy would appear.
    paths:
      include:
        - "**/rust-core/src/prose/"
      exclude:
        - "**/rust-core/src/prose/shared.rs"
    # The signature of balanced-delimiter scanning is ONE variable that goes both up and down in
    # the same loop. Matching a bare `$X += 1` instead flagged every loop counter in the tree —
    # including the `$$...$$` math scanners in latex.rs, which count position, not nesting.
    pattern-either:
      - pattern: |
          while $COND {
              ...
              $DEPTH += 1;
              ...
              $DEPTH -= 1;
              ...
          }
      - pattern: |
          while $COND {
              ...
              $DEPTH -= 1;
              ...
              $DEPTH += 1;
              ...
          }

  - id: use-shared-child-of-kind
    languages: [rust]
    severity: INFO
    message: >-
      `prose::shared::child_of_kind` reads one labelled child of a structured node — a
      directive's `type`, a block's name, a `command_name`. Walking the children by hand for
      the same answer is how the copies start: org.rs and rst.rs each grew a byte-identical
      private `child_of_kind`, and latex.rs open-coded a third inside `verbatim_command_end`.
      FORWARD GUARD: those three are now one shared helper, so this rule finds nothing today.
      It exists because every new extractor needs the same lookup on its first structured node.
    paths:
      include:
        - "**/rust-core/src/prose/"
      exclude:
        - "**/rust-core/src/prose/shared.rs"
    pattern-either:
      - pattern: $NODE.children(...).find(|$C| $C.kind() == $KIND)
      - pattern: |
          for $CHILD in $NODE.children(...) {
              ...
              if $CHILD.kind() == $KIND {
                  ...
                  return ...;
              }
              ...
          }

  - id: use-content-hash
    languages: [rust]
    severity: INFO
    message: >-
      `hashing::content_hash` owns "hash a file's text to a u64 for cache invalidation".
      `cache.rs` and `workspace.rs` each had a byte-identical private `hash_content`, which is
      a correctness question and not only a tidiness one: the two hashes are compared against
      values the other side wrote, so they have to stay the same function.
      FORWARD GUARD: both now call the shared helper, so this rule finds nothing today.
    paths:
      exclude:
        - "**/rust-core/src/hashing.rs"
    pattern: |
      let mut $H = DefaultHasher::new();
      $CONTENT.hash(&mut $H);
      $H.finish()

  - id: use-load-yaml-dir
    languages: [rust]
    severity: INFO
    message: >-
      `fs_util::load_yaml_dir` owns "read a config directory, take the `.yaml`/`.yml` files,
      treat a missing directory as empty". `sls.rs` and `style_rules.rs` each had their own
      copy of that loop, differing only in what they counted — and a missing-directory check
      dropped from one of them turns "this project configures no schemas" into an error.
      FORWARD GUARD: both now call the shared helper, so this rule finds nothing today.
    paths:
      exclude:
        - "**/rust-core/src/fs_util.rs"
    patterns:
      - pattern-inside: |
          for $ENTRY in std::fs::read_dir($DIR)? {
              ...
          }
      - pattern-either:
          - pattern: $EXT == "yaml"
          - pattern: $EXT == "yml"

  - id: match-slice-not-index-guards
    languages: [rust]
    severity: WARNING
    message: >-
      Match on the slice — `match bytes[i..] { [b'\\', b'[', ..] => … }` — instead of guarding
      each index by hand. `i + 1 < len && bytes[i] == A && bytes[i + 1] == B` writes the bounds
      check out once per branch, which is once per branch it can be dropped from, and it hides
      what shape is actually being matched. Binding the result (`i = match …`) also obliges every
      arm to yield the next index, so an arm cannot fall through without advancing — the loop
      that never terminates is the bug this designs out.
      The gap scanners in latex.rs, bibtex.rs, forester.rs, tinylang.rs and sweave.rs were all
      written this way; run against the revision before they were converted this rule reports
      20 findings across the five files, which is the answer it must keep finding if the shape
      comes back. `shared::run_end` and `shared::close_at` cover the character-run and
      scan-to-closing-delimiter cases that are left.
    paths:
      exclude:
        # `skip_balanced_*` are const fns, where a slice pattern with a guard does not compile.
        - "**/rust-core/src/prose/shared.rs"
    pattern-either:
      - pattern: $I + 1 < $SEQ.len() && ... && $SEQ[$I + 1] == $B
      - pattern: $SEQ[$I] == $A && $I + 1 < $SEQ.len() && ...
      - pattern: $I + 2 < $SEQ.len() && ... && $SEQ[$I + 2] == $C
      # The same guard hoisted into a loop header, with the indexing in the body.
      - patterns:
          - pattern-inside: |
              while $I + $N < $SEQ.len() {
                  ...
              }
          - pattern: $SEQ[$I + $N]

  - id: suppress-directives-through-inline-directives
    languages: [rust]
    severity: WARNING
    message: >-
      Call inline-directive suppression through `SuppressionContext::with_directives` and
      `retain_visible`, not `IgnoreParser::should_ignore*` directly. Those two need the WHOLE
      document and document-level diagnostic offsets, and the one call site that had neither
      shipped: `Orchestrator::check_batch` ran them against a single extracted prose range,
      where the comment carrying the directive has already been stripped and the offsets are
      range-local. Every `lang-check-disable`, `disable-next-line` and `begin`/`end` region was
      inert at runtime, in Markdown, LaTeX and Typst alike, while the `ignore_rules` unit tests
      -- which pass the whole document, as the API wants -- stayed green. Against the commit
      before the fix this rule finds the two calls that were the bug.
    paths:
      exclude:
        - "**/rust-core/src/suppression.rs"
        - "**/rust-core/src/ignore_rules.rs"
    pattern-either:
      - pattern: IgnoreParser::should_ignore(...)
      - pattern: IgnoreParser::should_ignore_by_region(...)
      - pattern: crate::ignore_rules::IgnoreParser::should_ignore(...)
      - pattern: crate::ignore_rules::IgnoreParser::should_ignore_by_region(...)

  - id: comment-syntax-through-in-comment
    languages: [rust]
    severity: WARNING
    message: >-
      Unwrap a line's comment through `text_util::in_comment`, which takes the content inside
      and hands it to a parser. The four spellings accepted -- `<!-- … -->`, `// …`, `/* … */`
      and `% …`, covering Markdown and HTML, the C-family markup languages and LaTeX -- are a
      single fact about what a directive may be written in, and a reader that spells them out
      for itself can accept a set the others do not. `ScopeParser::extract_marker` and
      `IgnoreParser::extract_directive` were byte-identical apart from which parser they called;
      run against the revision before they were converted this rule reports 2 findings, one per
      reader, which is the answer it must keep finding if the shape comes back.
    paths:
      exclude:
        - "**/rust-core/src/text_util.rs"
    patterns:
      - pattern-either:
          - pattern: $LINE.strip_prefix("<!--")
          - pattern: $LINE.strip_prefix("/*")
      - pattern-inside: |
          fn $F(...) -> $R {
              ...
          }

  - id: declared-extensions-through-declares-extension
    languages: [rust]
    severity: WARNING
    message: >-
      Match a configured extension list through `engines::declares_extension`. Accepting a
      leading dot, comparing case-insensitively, and treating an empty list as a wildcard are
      three decisions that have to agree between every engine that reads `extensions` from
      config, or the same `.languagecheck.yaml` means different things to an external provider
      and a WASM plugin. `ExternalEngine::handles_extension` and `WasmEngine::handles_extension`
      held byte-identical copies; run against the revision before they were converted this rule
      reports 2 findings, which is the answer it must keep finding if the shape comes back.
      `Config::admits_type` was a third copy it caught later (1 finding at b526abd); it differs
      only in admitting a path with no extension, which it now says with `is_none_or`.
    pattern: $E.trim_start_matches('.').eq_ignore_ascii_case($EXT)

  - id: workspace-blobs-through-cbor-helpers
    languages: [rust]
    severity: WARNING
    message: >-
      Round-trip workspace index values through `WorkspaceIndex::put_cbor` and `get_cbor`. Every
      table in the index maps a file path to an opaque CBOR blob, so encoding at the call site
      repeats the transaction and commit discipline once per table -- and a write that forgets
      `commit()` is silently dropped, which no test of the writer alone can see.
      `update_diagnostics`/`update_insights` and `get_diagnostics`/`get_insights` were two
      mirrored pairs differing only in the table constant and the value type; run against the
      revision before they were converted this rule reports 4 findings, one per method, which is
      the answer it must keep finding if the shape comes back.
    pattern-either:
      - pattern: ciborium::into_writer(...)
      - pattern: ciborium::from_reader(...)

  - id: cli-engine-probe-through-probe-cli-engine
    languages: [rust]
    severity: WARNING
    message: >-
      Probe an external-binary engine through `config_probe::probe_cli_engine`. It owns the three
      outcomes a binary-plus-config engine can have -- switched off (Skipped), not on PATH (Down,
      blamed on the install) and a config path that is not readable (reported against
      `engines.<name>.config`, not the binary) -- and the key names the editor gutter anchors to.
      `probe_vale` and `probe_proselint` were 0.97-similar copies differing only in the engine
      name; run against b526abd, the revision before they were converted, this rule reports 2
      findings, which is the answer it must keep finding if the shape comes back.
    paths:
      include:
        - "**/rust-core/src/config_probe.rs"
    patterns:
      - pattern: binary_version(...)
      - pattern-not-inside: |
          async fn probe_cli_engine(...) -> $R { ... }
      - pattern-not-inside: |
          mod tests { ... }

  - id: schema-fallback-through-schema-only-extensions
    languages: [rust]
    severity: WARNING
    message: >-
      Walk the extensions that only a schema handles through `SchemaRegistry::schema_only_extensions`.
      "a built-in grammar takes precedence over a schema" is one rule, and the editor learns it
      twice -- once as the extensions to send and once as the file patterns to watch -- so two
      filters that drift apart make the extension forward documents the core then ignores.
      `fallback_extensions` and `fallback_file_patterns` each held the nested loop; run against
      b526abd, the revision before they were converted, this rule reports 2 findings, which is
      the answer it must keep finding if the shape comes back.
    paths:
      include:
        - "**/rust-core/src/sls.rs"
    patterns:
      - pattern-either:
          - pattern: builtin_language_for_extension($E)
          - pattern: crate::languages::builtin_language_for_extension($E)
      - pattern-either:
          - pattern-inside: |
              for $S in &$R.schemas { ... }
          - pattern-inside: $R.schemas.iter(). ... 
      - pattern-not-inside: |
          fn schema_only_extensions(...) -> $T { ... }

  - id: bench-setup-through-bench-helpers
    languages: [rust]
    severity: INFO
    message: >-
      Build the engine under benchmark through `bench_extract`, `bench_harper` or
      `bench_morphology`. A benchmark is only comparable with its siblings when everything but
      the input is held fixed, and a copied body is where one of them quietly gets a different
      runtime, config or language tag. Seven benches repeated their setup; run against b526abd,
      the revision before they were converted, this rule reports 8 findings (three extractors,
      three Harper engines, two affix analyzers), which is the answer it must keep finding if the
      shape comes back.
    paths:
      include:
        - "**/rust-core/benches/"
    patterns:
      - pattern-either:
          - pattern: ProseExtractor::new(...)
          - pattern: HarperEngine::new(...)
          - pattern: lang_check::morphology::AffixAnalyzer::new(...)
          - pattern: AffixAnalyzer::new(...)
      - pattern-not-inside: |
          fn bench_extract(...) { ... }
      - pattern-not-inside: |
          fn bench_harper(...) { ... }
      - pattern-not-inside: |
          fn bench_morphology(...) { ... }

  - id: config-text-edits-through-config-edits
    languages: [typescript]
    severity: WARNING
    message: >-
      Edit `.languagecheck.yaml` text through `config/edits.ts` (`addLatexListEntry`,
      `setSpellLanguage`, `spellLanguageOf`, `engineEnabled`, `setEngineEnabled`,
      `deactivateRule`). Each of those is a string transform that only understands the layouts it
      matches, and a second private copy is where two commands start writing the same key
      differently. extension.ts carried these inline, some twice: run against 8b9a812, the
      revision before they were extracted, this rule reports 31 findings across eleven sites, which is the
      answer it must keep finding if the shape comes back.
    paths:
      include:
        - "**/extension/src/"
      exclude:
        - "**/extension/src/config/edits.ts"
        - "**/extension/src/configParsing.ts"
        - "**/extension/src/config/parsing.ts"
        - "**/extension/src/test/"
    pattern-either:
      - pattern-regex: '(?:/\^?|RegExp\(`[^`]*?)(?:spell_language|skip_environments|prose_environments|skip_commands|engines|latex|languages|rules):'
      - pattern-regex: 'enabled:\\+s\*\(true\|false\)'
      - pattern-regex: "includes\\('(?:spell_language|engines):'\\)"
