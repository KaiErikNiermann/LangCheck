# Prose style for this project's own documentation.
#
# `ai-tells` is fetched by `vale sync`, not vendored: it is 137 rule files
# that would otherwise sit in the diff of every unrelated change. `just
# docs-prose-sync` and the CI job both run the sync, so the version in force
# is whatever the package currently publishes.
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = ai-tells

[*.md]
BasedOnStyles = Vale, ai-tells
