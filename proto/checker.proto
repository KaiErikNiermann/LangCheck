syntax = "proto3";

package languagecheck;

message Request {
  uint64 id = 1;
  oneof payload {
    CheckRequest check_prose = 2;
    MetadataRequest get_metadata = 3;
    IgnoreRequest ignore = 4;
    InitializeRequest initialize = 5;
    AddDictionaryWordRequest add_dictionary_word = 6;
    ProbeConfigRequest probe_config = 7;
    ListConfigFilesRequest list_config_files = 8;
  }
}

message InitializeRequest {
  string workspace_root = 1;
  // VS Code global setting: whether to index the whole workspace on open.
  // The server uses this as a fallback when .languagecheck.yaml doesn't
  // set workspace.index_on_open.
  optional bool index_on_open = 2;
  // Custom path for the workspace database file. When empty, the server
  // stores databases in the user data directory (~/.local/share/language-check/dbs/).
  optional string db_path = 3;
  // VS Code global setting: whether to suppress spelling diagnostics on tokens
  // detected as human names. Used as a fallback when .languagecheck.yaml doesn't
  // set names.enabled.
  optional bool detect_names = 4;
  // VS Code global setting: whether to load the bundled domain-specific
  // dictionaries. Used as a fallback when .languagecheck.yaml doesn't set
  // dictionaries.bundled.
  optional bool dictionaries_bundled = 5;
  // VS Code global setting: names of individual bundled dictionaries to skip.
  // Used as a fallback when .languagecheck.yaml doesn't set
  // dictionaries.disabled.
  repeated string dictionaries_disabled = 6;
  // VS Code global setting: additional wordlist files to load. Used as a
  // fallback when .languagecheck.yaml doesn't set dictionaries.paths.
  repeated string dictionaries_paths = 7;
}

message IgnoreRequest {
  string message = 1;
  string context = 2;
  string text = 3;
  uint32 start_byte = 4;
  uint32 end_byte = 5;
}

message Response {
  uint64 id = 1;
  oneof payload {
    CheckResponse check_prose = 2;
    MetadataResponse get_metadata = 3;
    ErrorResponse error = 4;
    OkResponse ok = 5;
    ProbeConfigResponse probe_config = 6;
    ListConfigFilesResponse list_config_files = 7;
  }
}

message OkResponse {}

message ErrorResponse {
  string message = 1;
}

service CheckerProvider {
  // Main check request
  rpc CheckProse(CheckRequest) returns (CheckResponse);
  // Get available rules/settings for this provider
  rpc GetMetadata(MetadataRequest) returns (MetadataResponse);
  // Resolve every config reference that points outside the file
  rpc ProbeConfig(ProbeConfigRequest) returns (ProbeConfigResponse);
  // Which config is in force, and which files it selects for checking
  rpc ListConfigFiles(ListConfigFilesRequest) returns (ListConfigFilesResponse);
}

message CheckRequest {
  string text = 1;
  string language_id = 2;
  map<string, string> settings = 3;
  optional string file_path = 4;
}

message CheckResponse {
  repeated Diagnostic diagnostics = 1;
  ExtractionInfo extraction = 2;
  repeated EngineHealth engine_health = 3;
  // True when the engines did not run because the stored result for this file
  // still applied -- same text, same config, same dictionary, same ignored
  // set, same version. Reported so the inspector can say where an answer came
  // from, and so a test can assert reuse as a fact instead of inferring it
  // from how long the check took.
  bool served_from_cache = 4;
}

message EngineHealth {
  string name = 1;
  string status = 2;
  uint32 consecutive_failures = 3;
  string last_error = 4;
  uint64 last_success_epoch_ms = 5;
}

message ExtractionExclusion {
  uint32 start_byte = 1;
  uint32 end_byte = 2;
}

message ExtractionProseRange {
  uint32 start_byte = 1;
  uint32 end_byte = 2;
  repeated ExtractionExclusion exclusions = 3;
  // The natural language this range was checked in, as the BCP-47 tag that
  // reached the engines. Resolved, so a range that declared a bare "en" under
  // an en-GB document reads "en-GB" here and not "en".
  string language = 4;
}

// A span the name filter recognised as a human name and therefore silenced.
// Surfaced in the inspector so the suppression is visible and debuggable.
message NameSpan {
  uint32 start_byte = 1;
  uint32 end_byte = 2;
  // Summed signal weight behind the decision; higher means stronger evidence.
  float confidence = 3;
  // Comma-separated signal tags, e.g. "gazetteer,shape".
  string signals = 4;
}

message ExtractionInfo {
  repeated ExtractionProseRange prose_ranges = 1;
  repeated NameSpan names = 2;
  // The size a prose range is split at, in bytes, so the inspector can say
  // whether a range is one the cache can work with. Zero when splitting is
  // switched off, and a range over it is one that could not be divided.
  uint32 max_range_bytes = 4;
  // The markup grammar the prose was extracted with -- the canonical language
  // id after alias resolution, e.g. "typst" or "latex", or the name of the SLS
  // schema when one took over. What the editor calls the file is not always
  // what the core parsed it as, and the inspector exists to show the
  // difference.
  string syntax = 3;
}

message Diagnostic {
  uint32 start_byte = 1;
  uint32 end_byte = 2;
  string message = 3;
  repeated string suggestions = 4;
  string rule_id = 5;
  Severity severity = 6;
  string unified_id = 7;
  float confidence = 8;
  // The natural language this diagnostic concerns, when it is about a
  // language rather than about a word -- an unservable passage, a broken
  // dictionary. Set so the editor can offer to install a pack without
  // recovering the tag by parsing the message, which is where a false
  // positive would come from. Empty on ordinary diagnostics.
  string language = 9;
  // Whether a dictionary pack for `language` can be fetched. False when the
  // language has no published download, so the editor offers nothing it
  // cannot deliver.
  bool pack_installable = 10;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFORMATION = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  SEVERITY_HINT = 4;
}

message AddDictionaryWordRequest {
  string word = 1;
}

message MetadataRequest {}

message MetadataResponse {
  string name = 1;
  string version = 2;
  repeated string supported_languages = 3;
  string spell_language = 4;
  // File extensions, without the dot, that only an SLS schema handles.
  //
  // The editor decides what to send by VS Code's language id, and a schema
  // language has no id there -- so without this the schemas were unreachable
  // from the editor entirely, however correct they were.
  repeated string schema_extensions = 5;
}

// Ask what the config's external references resolve to right now.
//
// Separate from Initialize because the editor asks this about the buffer on
// screen, which may not be the config in force: the point is to answer for
// the text being typed, before it is saved and before any engine runs under
// it.
message ProbeConfigRequest {
  // The config file's text as the editor holds it, unsaved edits included.
  // Empty means read the workspace config from disk.
  string text = 1;
  // Which file the text came from, so a relative `vale.config` resolves
  // against the same directory the loader would use.
  optional string file_path = 2;
  // Format hint taken from the file name: "yaml" or "json". Empty means YAML,
  // which parses JSON too.
  string format = 3;
}

// What a probe found, keyed by where in the config it looked.
message ConfigProbe {
  // Dotted path to the key this is about, e.g. "engines.languagetool.url".
  // A key inside a map is spelled with the map key, e.g.
  // "engines.harper.linters.LongSentences"; a list entry uses its index,
  // e.g. "engines.languagetool.disabled_rules.0".
  string key = 1;
  ProbeStatus status = 2;
  // One line naming what was reached and what it answered, for the hover.
  string detail = 3;
  // The engine this key belongs to, empty for a top-level key. The editor
  // rolls child probes up onto the engine's own line with it.
  string engine = 4;
  // Whether the key is what is wrong, rather than its value. A rule name the
  // engine does not have is a bad key; a URL nothing answers on is a bad
  // value. The editor underlines whichever this names, because underlining
  // `false` when the name beside it is the typo points at the wrong token.
  bool blames_key = 5;
}

enum ProbeStatus {
  PROBE_STATUS_UNSPECIFIED = 0;
  // Resolved: the server answered, the file was read, the name is real.
  PROBE_STATUS_OK = 1;
  // Reached, but not entirely as configured -- a server that is up but does
  // not serve the configured language, a config file that parsed with
  // complaints.
  PROBE_STATUS_DEGRADED = 2;
  // Did not resolve. `detail` says why.
  PROBE_STATUS_DOWN = 3;
  // Not probed because the engine is switched off. Drawn as nothing, which
  // is different from drawn as failing.
  PROBE_STATUS_SKIPPED = 4;
}

message ProbeConfigResponse {
  repeated ConfigProbe probes = 1;
  // Set when the text could not be parsed at all, in which case `probes` is
  // empty and the editor has nothing to draw but this.
  string parse_error = 2;
  // Findings the file settles on its own -- a key no version of the schema
  // has, a value outside its enum. Kept apart from `probes` because they earn
  // no gutter mark: a mark means something outside the file was reached, and
  // a tick next to a spelling check would say nothing.
  repeated ConfigIssue issues = 3;
}

// Something wrong with the config that reading it is enough to establish.
message ConfigIssue {
  // Dotted path to the offending key, spelled as in ConfigProbe.
  string key = 1;
  string message = 2;
  Severity severity = 3;
}

// Which config is in force and which files it selects, as the CLI's
// `config files --skipped` prints it.
//
// Read from disk rather than from a buffer: the question is what a check
// would use, and that is the saved file.
message ListConfigFilesRequest {}

message ListConfigFilesResponse {
  // Absolute path of the config file in force. Empty when there is none and
  // the defaults apply.
  string config_path = 1;
  repeated string include = 2;
  // The default excludes included, since they reject files just the same.
  repeated string exclude = 3;
  repeated string file_types = 4;
  // Workspace-relative, `/`-separated, sorted.
  repeated string selected = 5;
  repeated SkippedFile skipped = 6;
  // Set when the config file could not be read. The lists then describe the
  // defaults, which is what the core falls back to.
  string load_error = 7;
}

message SkippedFile {
  // Workspace-relative, `/`-separated.
  string path = 1;
  // The config key that turned it away: "include", "exclude" or "file_types".
  string rejected_by = 2;
}
