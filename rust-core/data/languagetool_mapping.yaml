provider: languagetool
mappings:
  # Spelling
  #
  # Measured against LanguageTool 6.7 by sending a misspelling in each language
  # and reading back the rule whose issueType is "misspelling". German and
  # French do not use MORFOLOGIK, which is why guessing the id from the pattern
  # gets those two wrong -- and an unmapped spelling rule lands in
  # `style.unknown`, where the user dictionary, the name filter and
  # `lang-check-begin spelling.typo` all stop applying to it.
  - native_id: languagetool.MORFOLOGIK_RULE_EN_US  # English (US)
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_EN_GB  # English (GB)
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_EN_AU  # English (AU)
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_EN_CA  # English (CA)
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_EN_NZ  # English (NZ)
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_EN_ZA  # English (ZA)
    unified_id: spelling.typo
  - native_id: languagetool.GERMAN_SPELLER_RULE  # German -- not MORFOLOGIK
    unified_id: spelling.typo
  - native_id: languagetool.FR_SPELLING_RULE  # French -- not MORFOLOGIK
    unified_id: spelling.typo
  # Kept for servers older than 6.7, which did emit these.
  - native_id: languagetool.MORFOLOGIK_RULE_DE_DE
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_FR
    unified_id: spelling.typo
  - native_id: languagetool.MORFOLOGIK_RULE_ES  # Spanish
