[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # bincode unmaintained — transitive via burn-core (harper dep), no upgrade path
    "RUSTSEC-2025-0141",
    # fxhash unmaintained — transitive via wasmtime (extism dep), no upgrade path
    "RUSTSEC-2025-0057",
    # paste unmaintained — transitive via harper-core + burn-ndarray, no upgrade path
    "RUSTSEC-2024-0436",
    # wasmtime vulns — transitive via extism, awaiting upstream wasmtime bump
    "RUSTSEC-2026-0006",
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    "RUSTSEC-2026-0114",
    # aws-lc-rs / webpki cert-validation vulns — transitive via reqwest -> rustls,
    # awaiting upstream patched releases
    "RUSTSEC-2026-0044",
    "RUSTSEC-2026-0048",
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
