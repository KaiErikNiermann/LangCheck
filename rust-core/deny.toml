[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "warn"
# An ignore that no longer matches the lock file is an error, so entries
# cannot outlive the dependency they were written for.
unused-ignored-advisory = "deny"
ignore = [
    # bincode unmaintained — transitive via burn-core (harper dep), no upgrade path
    "RUSTSEC-2025-0141",
    # paste unmaintained — transitive via harper-core + burn-ndarray, no upgrade path
    "RUSTSEC-2024-0436",
    # zip 8.x vulns — transitive via harper-core 3.x (3.2.0 and master still
    # require zip ^8.6). Harper only reads its Weirpack archives with
    # by_index(), never extract(), ZipStreamReader or a decrypting read, and
    # LangCheck never loads a Weirpack. zip is built with deflate only, so the
    # aes-crypto (0545) and legacy-zip (0547) code is not compiled in.
    # Drop once harper moves to zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",
    # unsafe-libyaml unmaintained — via our serde_yaml (deprecated, no fixed
    # release); needs a migration to a maintained YAML crate.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
